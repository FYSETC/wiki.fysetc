name: Build and deploy Docusaurus

on:
  push:
    branches: [new-doc]
    # An image-only upload waits for a document change or manual deployment.
    paths-ignore:
      - 'static/images/**'
  pull_request:
    branches: [new-doc]
    paths-ignore:
      - 'static/images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test navigation model
        run: npm run test:navigation

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: docusaurus-static-site
          path: build/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/new-doc'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/new-doc'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
